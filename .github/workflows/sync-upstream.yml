name: Sync Upstream

# Syncs OS-layer content from commons-engineering/commons-os into a downstream
# instance (template copy or fork). Uses file-checkout (not git merge) so it
# works for template copies that share no git history with upstream.
#
# Ownership boundary (kept at the LEVEL, not per file, so new OS-canon files
# flow automatically without per-file scope maintenance):
#
#   Upstream owns (synced — whole subtree):
#     commons/             — manifests, specs, patterns, scripts, templates
#     extensions/          — bundled extension packs
#     instance/templates/  — OS-canon templates living inside the instance tree
#     .devcontainer/       — cloud workspace (Codespaces) setup
#     .github/workflows/   — automation that belongs to the OS
#
#   Upstream owns (synced — small enumerated root files):
#     BOOT.md, ALIGN.md, CONTRIBUTING.md, LICENSE
#     AGENT.md.template, blueprint.md.template
#     .mcp.json, .gitignore
#
#   Instance owns (NEVER touched — full sovereignty):
#     instance/  (everything except instance/templates/)
#     .commons/  — identity & config
#     blueprint.md, AGENT.md
#     CLAUDE.md, GEMINI.md, AGENTS.md  — tool-specific pointers
#     README.md  — instance-specific readme
#     anything the instance adds inside an upstream-owned subtree
#     (file-checkout adds/updates upstream files but does NOT delete locally
#      added files, so instance-added content under e.g. extensions/<own>/
#      coexists peacefully with upstream extensions).
#
# Adoption is always conscious: the workflow opens a PR; the founder decides.

on:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/commons-engineering/commons-os.git || true
          git fetch upstream main

      - name: Check for upstream changes
        id: check
        run: |
          DIFF=$(git diff HEAD...upstream/main -- \
            commons/ \
            extensions/ \
            instance/templates/ \
            .devcontainer/ \
            .github/workflows/ \
            BOOT.md \
            ALIGN.md \
            CONTRIBUTING.md \
            LICENSE \
            AGENT.md.template \
            blueprint.md.template \
            .mcp.json \
            .gitignore \
            | wc -l)
          echo "diff_lines=$DIFF" >> $GITHUB_OUTPUT
          echo "Upstream diff: $DIFF lines"

      - name: Sync OS files
        if: steps.check.outputs.diff_lines != '0'
        run: |
          BRANCH="upstream-sync-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"

          # File-checkout from upstream/main on the upstream-owned paths.
          # This updates/adds upstream files but never deletes instance-added
          # files within these subtrees - clean coexistence.
          git checkout upstream/main -- \
            commons/ \
            extensions/ \
            instance/templates/ \
            .devcontainer/ \
            .github/workflows/ \
            BOOT.md \
            ALIGN.md \
            CONTRIBUTING.md \
            LICENSE \
            AGENT.md.template \
            blueprint.md.template \
            .mcp.json \
            .gitignore \
            2>/dev/null || true

          # Heal the canonical hull structure (additive; only adds empty-dir
          # .keep, e.g. a missing extensions/ skeleton). Never touches content.
          bash commons/scripts/ensure-structure.sh || true

          if git diff --cached --quiet && git diff --quiet; then
            echo "No effective changes after sync"
            exit 0
          fi

          git add -A
          git commit -m "Sync upstream Commons OS ($(date +%Y-%m-%d))"
          git push origin HEAD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open PR
        if: steps.check.outputs.diff_lines != '0'
        run: |
          if git rev-parse --verify "origin/upstream-sync-$(date +%Y%m%d-*)" 2>/dev/null; then
            gh pr create \
              --title "Upstream sync — $(date +%Y-%m-%d)" \
              --body "$(cat <<'BODY'
          ## Automated Commons OS Sync

          Updates the OS-layer content from `commons-engineering/commons-os`.
          Adoption is conscious: review the diff, then merge.

          **Synced (upstream owns — whole subtree):**
          - `commons/`, `extensions/`, `instance/templates/`
          - `.devcontainer/`, `.github/workflows/`

          **Synced (upstream owns — root files):**
          - `BOOT.md`, `ALIGN.md`, `CONTRIBUTING.md`, `LICENSE`
          - `AGENT.md.template`, `blueprint.md.template`
          - `.mcp.json`, `.gitignore`

          **Never touched (instance sovereignty):**
          - `instance/` (except `instance/templates/`)
          - `.commons/`, `blueprint.md`, `AGENT.md`
          - `CLAUDE.md`, `GEMINI.md`, `AGENTS.md`, `README.md`

          Your instance-owned files are untouched. Files you added inside an
          upstream-owned subtree (e.g. your own pack under `extensions/`) also
          coexist - file-checkout adds and updates, never deletes your additions.
          BODY
          )" \
              --label "production"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
