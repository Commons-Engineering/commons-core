name: Sync

# Keeps this house's hull — scripts, workflows, skeleton — up to date with commons-core, as a pull
# request. Content never arrives here; it comes through the Install workflow.
# The first run in a house made with "Use this template" connects it to commons-core once.

on:
  schedule:
    - cron: '0 6 * * 1'   # weekly, Monday 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    # commons-core itself has nothing to sync from
    if: github.repository != 'Commons-Engineering/commons-core'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync the hull
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "commons-sync[bot]"
          git config user.email "sync@commons.engineering"
          BRANCH="hull-sync-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          python3 .commons/scripts/sync.py | tee sync.log
          bash .commons/scripts/ensure-structure.sh
          git add -A -- instance .commons/scripts .github 2>/dev/null || true
          git diff --cached --quiet || git commit -qm "Complete the hull skeleton"
          if [ -z "$(git log --oneline origin/main..HEAD)" ]; then
            echo "The hull is current."
            exit 0
          fi
          git push -q origin "$BRANCH"
          { echo "The hull of this house, synced from commons-core. Content is untouched — it arrives through Install."; echo; echo '```'; cat sync.log; echo '```'; } > body.md
          gh pr create --title "Sync the hull from commons-core" --body-file body.md
