name: Install

# Brings this house the content it declares in .commons/identity.yml — instance_type and domain —
# from commons-library, as a pull request. Run it from the Actions tab: "Install" → "Run workflow".
# Nothing reaches main until someone merges the pull request.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Library release (leave empty for the newest)"
        required: false
        default: ""
      adopt:
        description: "Take the library's version where the house differs"
        type: boolean
        default: false

jobs:
  install:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Install
        id: run
        run: |
          ARGS=""
          [ -n "${{ inputs.tag }}" ] && ARGS="$ARGS --tag ${{ inputs.tag }}"
          [ "${{ inputs.adopt }}" = "true" ] && ARGS="$ARGS --adopt"
          python3 .commons/scripts/install.py $ARGS | tee install.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open the pull request
        if: steps.run.outputs.status == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- . ':!install.log')" ]; then
            echo "Already current — nothing to propose."
            exit 0
          fi
          git config user.name "commons-install[bot]"
          git config user.email "install@commons.engineering"
          BRANCH="install-$(date +%Y%m%d-%H%M)"
          git checkout -b "$BRANCH"
          git add -A -- . ':!install.log'
          git commit -m "Install from commons-library" -q
          git push -q origin "$BRANCH"
          { echo "Content installed from commons-library, as this house declares it."; echo; echo '```'; cat install.log; echo '```'; } > body.md
          gh pr create --title "Install from commons-library" --body-file body.md
