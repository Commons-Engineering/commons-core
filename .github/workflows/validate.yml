name: Validate Structure

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          MISSING=0
          for f in \
            ".commons/identity.yml" \
            ".commons/config.yml" \
            "ALIGN.md" \
            "BOOT.md" \
            "commons/manifests/COMMONS_OS_MANIFEST.md" \
            "commons/manifests/COMMONS_AGENT_MANIFEST.md" \
            "commons/specs/COMMONS_OS_SPEC.md" \
            "commons/specs/PATTERN_SPEC.md"; do
            if [ ! -f "$f" ]; then
              echo "MISSING: $f"
              MISSING=$((MISSING + 1))
            fi
          done
          # A blueprint must exist as either the living instance file or the hull template
          if [ ! -f "blueprint.md" ] && [ ! -f "blueprint.md.template" ]; then
            echo "MISSING: blueprint.md (or blueprint.md.template)"
            MISSING=$((MISSING + 1))
          fi
          if [ $MISSING -gt 0 ]; then
            echo "$MISSING required file(s) missing"
            exit 1
          fi
          echo "All required files present"

      - name: Check canonical hull structure
        run: |
          # Single source of truth: the canonical directory skeleton lives in
          # commons/scripts/ensure-structure.sh. --check fails the PR if any
          # canonical directory is missing (e.g. a dropped extensions/ skeleton).
          bash commons/scripts/ensure-structure.sh --check

      - name: Validate identity.yml
        run: |
          if ! python3 -c "import yaml; yaml.safe_load(open('.commons/identity.yml'))" 2>/dev/null; then
            echo "identity.yml is not valid YAML"
            exit 1
          fi
          echo "identity.yml is valid"
