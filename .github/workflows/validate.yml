name: Validate

# Checks a pull request against what this house is. The hull always; the content only once it is
# installed — a fresh house is a bare hull until its first install.

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The hull is complete
        run: bash .commons/scripts/ensure-structure.sh --check

      - name: identity.yml and config.yml are valid YAML
        run: |
          for f in .commons/identity.yml .commons/config.yml; do
            python3 -c "import sys, yaml; yaml.safe_load(open(sys.argv[1]))" "$f" || { echo "$f is not valid YAML"; exit 1; }
          done
          echo "valid"

      - name: Installed content is what the library delivered
        run: |
          if [ ! -f .commons/library.lock ]; then
            echo "Nothing installed yet — run the Install workflow once the house has declared what it is."
            exit 0
          fi
          python3 - <<'EOF'
          import hashlib, os, sys
          bad = []
          for line in open(".commons/library.lock", encoding="utf-8"):
              if not line.strip() or line.startswith("#"):
                  continue
              h, rel = line.rstrip("\n").split("  ", 1)
              if not os.path.exists(rel):
                  bad.append(f"missing  {rel}")
              elif hashlib.sha256(open(rel, "rb").read()).hexdigest() != h:
                  bad.append(f"changed  {rel}")
          for b in bad:
              print(b)
          if bad:
              print(f"{len(bad)} installed file(s) differ from the library. Installed content is not edited in a house: "
                    "propose the change upstream, or run Install to restore it.")
              sys.exit(1)
          print("installed content matches the library")
          EOF
