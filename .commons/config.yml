# Commons Core Configuration
commons_core_version: "0.3"

# Where this house's hull and content come from (target architecture §3–§4a).
#   hull     — synced by .commons/scripts/sync.py (a pull request, never a forced change)
#   library  — installed by .commons/scripts/install.py; what was delivered is recorded in
#              .commons/library.yml and .commons/library.lock
sources:
  hull: "Commons-Engineering/commons-core"
  library: "Commons-Engineering/commons-library"

# 3-MCP Connections (see COMMONS_MCP_SPEC, BLUEPRINT_MCP_SPEC and FABRIC_MCP_SPEC)
mcp:
  # Channel 1: the Federation's Commons MCP — operated by cloudsters; serves every listed extension by ring
  commons:
    endpoint: "https://mcp.commons.engineering/mcp"
    ring: OPEN                         # FREE | DOCK | OPEN | PEER | CORE | WORK | CORP — the ring decides what is served
    # api_key: stored in GitHub Secrets, not here

  # Channel 2: Blueprint MCP — local knowledge graph (owned by this commons)
  blueprint:
    endpoint: null                     # Configure when Blueprint MCP is set up
    enabled: false

  # Channel 3: Fabric MCPs — Systems of Record (owned by this commons)
  fabric: []
  # Example:
  # - name: "SAP S/4HANA"
  #   endpoint: "https://erp.example.com/mcp"
  #   capabilities: [read, subscribe]

# Publishing configuration
publishing:
  intranet:
    enabled: false
    generator: hugo
    deploy_target: gh-pages
  extranet:
    enabled: false
    generator: hugo
    deploy_target: gh-pages

# Value stream families — loaded based on domain
# Override these with your instance-specific value streams
value_streams:
  purpose: []                          # D1 value stream families
  participation: []                    # D2 value stream families
  proposition: []                      # D3 value stream families
  production: []                       # D4 value stream families
